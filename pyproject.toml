[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wyag"
version = "0.1.0"
description = "Git'ning Python'dagi implementatsiyasi"
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
wyag = "wyag.__main__:main"

[tool.setuptools]
packages = ["wyag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
