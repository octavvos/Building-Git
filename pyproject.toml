[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wyag"
version = "0.1.0"
description = "Git'ning Python'dagi implementatsiyasi"
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
wyag = "wyag.__main__:main"

[tool.setuptools]
packages = ["wyag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=wyag --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
